<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wings Server - Automated Provisioning Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-lg p-6 border border-gray-700">
        <h1 class="text-2xl font-bold text-center mb-2 text-blue-400">Wings Server Store</h1>
        <p class="text-gray-400 text-center text-sm mb-6">Pilih layanan server & buat akun panel secara otomatis!</p>

        <form id="orderForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Username Panel</label>
                <input type="text" id="username" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500" placeholder="contoh: budigamer">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Email Aktif</label>
                <input type="email" id="email" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500" placeholder="contoh: budi@gmail.com">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Pilih Layanan (Egg)</label>
                <select id="eggType" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
                    <option value="nodejs20">Node.js 20 (Bot / Web)</option>
                    <option value="python">Python Bot</option>
                    <option value="minecraft">Minecraft Server</option>
                    <option value="samp">SA-MP Server</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Paket Server</label>
                <input type="text" id="paket" value="Paket Regular 2GB" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 font-semibold py-2 px-4 rounded transition duration-200">
                Simulasikan Bayar QRIS & Buat Server
            </button>
        </form>

        <div id="resultBox" class="mt-4 hidden p-4 rounded bg-gray-700 text-sm"></div>
    </div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const eggType = document.getElementById('eggType').value;
            const paket = document.getElementById('paket').value;

            btn.disabled = true;
            btn.innerText = "Memproses & Membuat Server...";
            resultBox.classList.add('hidden');

            try {
                // Mengirim data ke backend lokal Node.js
                const response = await fetch('http://localhost:3000/api/create-server', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, eggType, paket })
                });

                const data = await response.json();

                resultBox.classList.remove('hidden');
                if (data.success) {
                    resultBox.className = "mt-4 p-4 rounded bg-green-900 border border-green-700 text-green-200 text-sm";
                    resultBox.innerHTML = `
                        <strong>✅ Berhasil!</strong><br>
                        ${data.message}<br><br>
                        <strong>Detail Akun Panel:</strong><br>
                        - Panel URL: ${data.credentials.panelUrl}<br>
                        - Username: ${data.credentials.username}<br>
                        - Password: <code>${data.credentials.password}</code><br>
                        - Server: ${data.credentials.serverName}
                    `;
                } else {
                    resultBox.className = "mt-4 p-4 rounded bg-red-900 border border-red-700 text-red-200 text-sm";
                    resultBox.innerHTML = `<strong>❌ Gagal:</strong> ${data.message}`;
                }
            } catch (err) {
                resultBox.classList.add('hidden');
                resultBox.className = "mt-4 p-4 rounded bg-red-900 border border-red-700 text-red-200 text-sm";
                resultBox.innerHTML = `<strong>❌ Error Koneksi:</strong> Gagal terhubung ke backend server (pastikan backend menyala di port 3000).`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Simulasikan Bayar QRIS & Buat Server";
            }
        });
    </script>
</body>
</html>
